<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - SIMDIR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px;
      text-align: center;
    }
    
    .icon {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      box-shadow: 0 10px 40px rgba(245, 158, 11, 0.3);
    }
    
    .icon span {
      font-size: 64px;
      font-weight: 900;
      color: #0f172a;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    
    p {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 32px;
      max-width: 400px;
      line-height: 1.6;
    }
    
    .button {
      padding: 14px 28px;
      background: #f59e0b;
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    
    .button:hover {
      background: #d97706;
    }
  </style>
</head>
<body>
  <div class="icon">
    <span>S</span>
  </div>
  <h1>Anda Sedang Offline</h1>
  <p>Sepertinya koneksi internet Anda terputus. Silakan periksa koneksi Anda dan coba lagi.</p>
  <a href="/" class="button">Coba Lagi</a>
</body>
</html>
